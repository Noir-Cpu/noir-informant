version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Wait three days after a release before proposing it, so a hijacked or yanked version is usually gone first.
    cooldown: { default-days: 3 }
    # Major upgrades are done by hand, one at a time.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # Actions are pinned by commit SHA; Dependabot rewrites the SHA and the version comment together.
    cooldown: { default-days: 3 }
    groups:
      actions:
        patterns: ["*"]
