name: Collect and predict
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below.
permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

# Scheduled runs only happen on the default branch of the upstream repository. The `if` guards also stop a fork, or a
# manual run started from another branch, from committing data or deploying.
jobs:
  run:
    if: github.repository == 'Noir-Cpu/noir-informant' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Needs to push the data commit. It has no Cloudflare credentials.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s collector/tests -t .
      - run: python -m unittest discover -s informant/tests -t .
      - run: python -m informant.verify
      - run: python -m collector.run
      # Predictions are written after fresh data is stored, and only for matches more than 2 hours from kickoff.
      - run: python -m informant.predict
      - run: python -m informant.verify
      - run: python -m informant.evaluate
      - name: Commit new data and predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data predictions apps/web/public/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  # Separate job so the Cloudflare token is never in the environment of the job that can push to the repository
  # (and the job that can push never sees the token). Only runs on the default branch of the upstream repository.
  deploy:
    needs: run
    if: github.repository == 'Noir-Cpu/noir-informant' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The data commit made by the previous job is on main, not at the sha this run started from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - name: Deploy site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No Cloudflare token configured; skipping deploy."
            exit 0
          fi
          npm ci
          npm run deploy
