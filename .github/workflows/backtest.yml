name: Backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * 1"   # weekly, so the published backtest tracks new results

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m informant.backtest
      - run: python -m informant.evaluate
      - name: Commit refreshed backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add informant/out apps/web/public/data
          git diff --cached --quiet || (git commit -m "backtest: refresh $(date -u +%F)" && git push)
