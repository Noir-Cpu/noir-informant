name: Backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * 1"   # weekly, so the published backtest tracks new results

permissions:
  contents: read

jobs:
  backtest:
    if: github.repository == 'Noir-Cpu/noir-informant' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # pushes the refreshed backtest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      - run: python -m informant.backtest
      - run: python -m informant.evaluate
      - name: Commit refreshed backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add informant/out apps/web/public/data
          git diff --cached --quiet || (git commit -m "backtest: refresh $(date -u +%F)" && git push)
